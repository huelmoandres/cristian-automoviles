name: Windows release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY || github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
      - name: Validate release destination
        run: node scripts/prepare-github-release.mjs check
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend and publishing scripts
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/updater-utils.test.mjs scripts/prepare-github-release.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Rust and generate bindings
        working-directory: src-tauri
        run: |
          cargo fmt -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build signed Windows installer
        id: build
        run: node scripts/release-update.mjs --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Prepare verified release artifacts
        run: node scripts/prepare-github-release.mjs prepare
      - name: Preserve signed installer artifacts
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/updates/github/*.exe
            src-tauri/target/updates/github/*.exe.sig
            src-tauri/target/updates/github/latest.json
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Verify artifacts and create release draft
        run: node scripts/prepare-github-release.mjs draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
