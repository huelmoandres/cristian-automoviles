[package]
name = "cristian-automoviles"
version = "0.1.0"
description = "Gestión de stock, ventas y cobranzas para Cristian Automóviles"
authors = ["Cristian Automóviles"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cristian_automoviles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions", "backup"] }
rusqlite_migration = "2.6.0"
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
argon2 = "0.6.0"
ts-rs = "12.0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
